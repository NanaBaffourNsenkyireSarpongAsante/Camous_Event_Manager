<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEM | Calendar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f0f4fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-card {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0, 40, 100, 0.2);
        }

        .back-btn {
            display: inline-block;
            background: #e6efff;
            color: #1e3a8a;
            padding: 8px 16px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 20px;
            transition: 0.2s;
            border: 1px solid #bdd3ff;
        }

        .back-btn:hover {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }

        /* Two separate columns */
        .dashboard {
            display: flex;
            gap: 30px;
        }

        /* Left column – calendar panel */
        .calendar-panel {
            flex: 2;
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        /* Right column – events panel (visually separate) */
        .events-panel {
            flex: 1;
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            font-size: 1.5rem;
            color: #1e3a8a;
            font-weight: 600;
        }

        .nav-btn {
            background: #e6efff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            color: #1e3a8a;
            transition: 0.2s;
            border: 1px solid #bdd3ff;
        }

        .nav-btn:hover {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .weekday {
            text-align: center;
            font-weight: 600;
            color: #1e3a8a;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-cell {
            aspect-ratio: 1 / 1;
            background: #f8fbff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e3a8a;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .day-cell:hover {
            background: #d4e2fc;
            border-color: #1e3a8a;
        }

        .day-cell.today {
            background: #1e3a8a;
            color: white;
            font-weight: 600;
        }

        .day-cell.has-event {
            background: #bdd3ff;
            color: #1e3a8a;
            font-weight: 600;
        }

        .day-cell.other-month {
            opacity: 0.3;
            background: transparent;
        }

        .events-panel h3 {
            font-size: 1.2rem;
            color: #1e3a8a;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #1e3a8a;
            padding-bottom: 10px;
        }

        .event-list {
            flex: 1;
            overflow-y: auto;
            max-height: 350px;
            padding-right: 5px;
        }

        .event-item {
            background: #f8fbff;
            border-radius: 16px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 4px solid #1e3a8a;
            transition: 0.2s;
        }

        .event-item:hover {
            background: #e6efff;
            transform: translateX(3px);
        }

        .event-icon {
            color: #1e3a8a;
            font-size: 1.2rem;
            width: 28px;
            text-align: center;
        }

        .event-details {
            flex: 1;
        }

        .event-title {
            font-weight: 700;
            color: #1e3a8a;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .event-meta {
            font-size: 0.8rem;
            color: #4b5563;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .event-meta i {
            color: #1e3a8a;
            width: 14px;
            margin-right: 4px;
        }

        @media (max-width: 700px) {
            .dashboard {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-card">
        <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>

        <div class="dashboard">
            <!-- Left: Calendar -->
            <div class="calendar-panel">
                <div class="calendar-header">
                    <button class="nav-btn" id="prevMonth"><i class="fas fa-chevron-left"></i></button>
                    <h2 id="currentMonth">March 2026</h2>
                    <button class="nav-btn" id="nextMonth"><i class="fas fa-chevron-right"></i></button>
                </div>

                <div class="weekdays">
                    <div class="weekday">Sun</div>
                    <div class="weekday">Mon</div>
                    <div class="weekday">Tue</div>
                    <div class="weekday">Wed</div>
                    <div class="weekday">Thu</div>
                    <div class="weekday">Fri</div>
                    <div class="weekday">Sat</div>
                </div>

                <div class="days-grid" id="calendarDays"></div>
            </div>

            <!-- Right: Upcoming Events (separate panel) -->
            <div class="events-panel">
                <h3><i class="fas fa-calendar-check"></i> Upcoming Events</h3>
                <div class="event-list" id="eventList"></div>
            </div>
        </div>
    </div>

    <script>
        // Sample events (all blue)
        const events = [
            { title: "AI Seminar", date: "2026-03-15", time: "10:00 AM", venue: "CCB" },
            { title: "Music Festival", date: "2026-03-22", time: "4:00 PM", venue: "Freedom Square" },
            { title: "Tech Conference", date: "2026-03-28", time: "9:00 AM", venue: "Auditorium" },
            { title: "Art Workshop", date: "2026-03-05", time: "2:00 PM", venue: "Cultural Centre" },
            { title: "Career Fair", date: "2026-03-18", time: "11:00 AM", venue: "Engineering" }
        ];

        let currentDate = new Date(2026, 2, 1); // March 2026

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            document.getElementById('currentMonth').textContent = 
                currentDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            
            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const prevLastDate = new Date(year, month, 0).getDate();
            
            let days = '';
            
            for (let i = firstDay - 1; i >= 0; i--) {
                days += `<div class="day-cell other-month">${prevLastDate - i}</div>`;
            }
            
            const today = new Date();
            for (let i = 1; i <= lastDate; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const hasEvent = events.some(e => e.date === dateStr);
                const isToday = i === today.getDate() && month === today.getMonth() && year === today.getFullYear();
                
                days += `<div class="day-cell ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}">${i}</div>`;
            }
            
            const totalCells = Math.ceil((firstDay + lastDate) / 7) * 7;
            const remainingCells = totalCells - (firstDay + lastDate);
            
            for (let i = 1; i <= remainingCells; i++) {
                days += `<div class="day-cell other-month">${i}</div>`;
            }
            
            document.getElementById('calendarDays').innerHTML = days;
            
            // Show upcoming events (all events, not just this month – you can filter as needed)
            const eventList = document.getElementById('eventList');
            
            if (events.length === 0) {
                eventList.innerHTML = '<div style="color: #4b5563; text-align: center; padding: 20px;">No events scheduled</div>';
            } else {
                eventList.innerHTML = events.map(event => `
                    <div class="event-item">
                        <div class="event-icon"><i class="fas fa-calendar-day"></i></div>
                        <div class="event-details">
                            <div class="event-title">${event.title}</div>
                            <div class="event-meta">
                                <span><i class="fas fa-calendar"></i> ${event.date}</span>
                                <span><i class="fas fa-clock"></i> ${event.time}</span>
                                <span><i class="fas fa-map-marker-alt"></i> ${event.venue}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        document.getElementById('prevMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        document.getElementById('nextMonth').addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();
    </script>
</body>
</html>
